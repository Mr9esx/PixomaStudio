[package]
name = "pixoma-studio"
version = "0.1.0"
edition = "2024"
authors = ["李卓洲 <1138099359@qq.com>"]
autotests = false

[lib]
name = "pixoma_studio"

[[test]]
name = "integration"
path = "tests/integration.rs"

[profile.dev]
debug = "line-tables-only"
strip = "none"

[profile.release]
strip = "none"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
headers = "0.4"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gray_matter = "0.3"
semver = "1"
jsonschema = { version = "0.59", default-features = false }
base64 = "0.22"
tiktoken-rs = "0.12.1"
text-splitter = { version = "0.33", features = ["tiktoken-rs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "serde", "parsing"] }
thiserror = "2"
sha2 = "0.10"
infer = "0.19"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
exoquant = "0.2"
reqwest = { version = "0.13", features = ["json", "query", "multipart", "stream"] }
url = "2"
percent-encoding = "2"
http-range = "0.1"
serde_urlencoded = "0.7"
rig = "=0.44.0"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest", "elicitation"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"

[dev-dependencies]
hound = "3"
