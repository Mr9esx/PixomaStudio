    content = `<div class="row"><h2 class="grow">${models ? '模型' : 'MCP'}</h2>${button(models ? '添加模型' : '添加 MCP',models ? 'add-model' : 'add-mcp','primary','plus')}</div><div style="margin-top:24px">${items.length ? `<div class="link-list">${items.map((item,index) => `<div class="link-row">${icon(models ? 'model' : 'cable')}<div class="grow"><h3>${escapeText(item.name)}</h3><small>${escapeText(item.url)}</small></div>${dot}<small>未测试</small>${button('编辑',`${models ? 'model' : 'mcp'}:${index}`)}</div>`).join('')}</div>` : empty(models ? '暂无模型' : '暂无 MCP 连接',models ? 'model' : 'cable')}</div>`;
  } else if (state.setting === 'generation') content = `<div class="stack"><div class="row"><h2 class="grow">生成服务</h2>${button('添加服务','new-service','primary','plus')}</div><div class="link-list">${state.services.map(service => `<div class="link-row">${icon('cable')}<div class="grow"><h3>${escapeText(service.name)}</h3><small>${escapeText(service.provider)}</small></div>${dot}<small>${service.configured ? '尚未验证' : '未配置凭据'}</small>${button('配置',`service:${service.id}`)}</div>`).join('')}</div></div>`;
  else if (state.setting === 'nodes') content = nodesPage();
  else if (state.setting === 'sessions') content = `<div class="stack"><h2>会话</h2><div class="table-wrap"><table><thead><tr><th>对话</th><th>项目</th><th>操作</th></tr></thead><tbody><tr><td>角色设定草稿</td><td>角色与分镜</td><td>${button('打开','open-chat','ghost')}</td></tr><tr><td>整理镜头描述</td><td>未归属项目</td><td>${button('打开','open-chat','ghost')}</td></tr></tbody></table></div></div>`;
  else content = `<h2>应用</h2><div class="setting-row" style="margin-top:20px"><div><h3>外观</h3><small>浅色 / 深色</small></div>${button('切换主题','theme')}</div><div class="setting-row"><h3>语言</h3><select aria-label="语言"><option>简体中文</option></select></div><div class="setting-row"><h3>本地数据</h3><span class="muted">项目、会话、资产与设置</span></div>`;
  return `${heading('<h1>设置</h1>',state.returnWorkflow ? button('返回工作流','return-workflow','','back') : '')}<div class="settings-shell"><nav class="settings-nav" aria-label="设置分类">${sections.map(([key,label]) => `<button class="${state.setting === key ? 'active' : ''}" data-action="setting:${key}">${label}</button>`).join('')}</nav><div class="settings-content"><div class="settings-inner ${state.setting === 'nodes' ? 'nodes-inner' : ''}">${content}</div></div></div>`;
}
function render() {
  const parameters = new URLSearchParams(location.hash.slice(1));
  const requested = parameters.get('page');
  state.page = ['chat','library','workflows','skills','experts','settings'].includes(requested) ? requested : 'chat';
  const detail = parameters.get('detail');
  if (state.page === 'workflows' && detail && state.workflows.some(item => item.id === detail)) state.workflow = detail;
  document.querySelectorAll('[data-nav]').forEach(element => { const active = element.dataset.nav === state.page; element.classList.toggle('active',active); if (active) element.setAttribute('aria-current','page'); else element.removeAttribute('aria-current'); });
  pageElement.innerHTML = state.page === 'chat' ? chatPage() : state.page === 'workflows' ? (detail ? workflowPage() : workflowListPage()) : state.page === 'skills' ? resourcePage('skills') : state.page === 'experts' ? (detail ? expertPage() : resourcePage('experts')) : state.page === 'library' ? libraryPage() : settingsPage();
  document.title = `Pixoma Studio · ${{chat:'对话',library:'资产库',workflows:'工作流',skills:'技能',experts:'专家',settings:'设置'}[state.page]} · 布局演示`;
}
function nodeDialog(fresh) {
  const node = fresh ? { name:'',location:'本机',url:'http://127.0.0.1:8188',category:'' } : state.nodes.find(item => item.id === state.node);
  showDialog(fresh ? '新建计算节点' : '编辑计算节点',`<form id="node-form" class="fields">${field('名称','name',node.name)}<label class="field">节点位置<select name="location"><option ${node.location === '本机' ? 'selected' : ''}>本机</option><option ${node.location === '远程' ? 'selected' : ''}>远程</option></select></label>${field('ComfyUI 地址','url',node.url,'url')}${field('分类','category',node.category)}<label class="toggle"><input type="checkbox" checked>启用节点</label><input name="fresh" type="hidden" value="${fresh}"></form>`,button('取消','close') + button('保存节点','save-node','primary'));
}
function connectionDialog(models,index) {
  const item = (models ? state.models : state.connectors)[index] ?? {name:'',url:'',model:''};
  showDialog(models ? '配置模型' : '配置 MCP',`<form id="connection-form" class="fields">${field('名称','name',item.name)}${models ? '<label class="field">协议<select name="protocol"><option>OpenAI Responses</option><option>OpenAI Chat Compatible</option><option>Anthropic Messages Compatible</option></select></label>' : ''}${field(models ? 'Base URL' : '服务地址','url',item.url,'url')}${models ? field('Model ID','model',item.model) : '<label class="field">调用策略<select name="policy"><option>需要审批</option><option>自动审批只读工具</option><option>禁止调用</option></select></label>'}${field(models ? 'API Key' : '访问凭据','credential','','password')}<label class="toggle"><input type="checkbox" checked>启用${models ? '模型' : '连接'}</label></form>`,button('取消','close') + button('保存配置',`save-connection:${models ? 'models' : 'connectors'}:${index ?? ''}`,'primary'));
}
function serviceDialog(id) {
  const item = state.services.find(service => service.id === id) ?? {name:'',provider:'火山方舟',configured:false};
  showDialog(id ? '配置生成服务' : '添加生成服务',`<form id="service-form" class="fields">${field('连接名称','name',item.name)}<label class="field">服务商<select name="provider">${['火山方舟','MiniMax'].map(provider => `<option ${item.provider === provider ? 'selected' : ''}>${provider}</option>`).join('')}</select></label>${field('API Key','credential','','password')}</form>`,button('取消','close')+button('保存连接',`save-service:${id ?? ''}`,'primary'));
}
document.addEventListener('click', event => {
  const target = event.target.closest('button,[data-action]'); if (!target) return;
  if (target.dataset.nav) { state.editing = false; state.draft = null; state.returnWorkflow = ''; navigate(target.dataset.nav); return; }
  const action = target.dataset.action; if (!action) return;
  const [kind,value,extra] = action.split(':');
  if (kind === 'close') { dialog.close(); return; }
  if (kind === 'theme') { document.documentElement.classList.toggle('dark'); return; }
  if (kind === 'menu') { document.getElementById('sidebar').classList.toggle('open'); return; }
  if (kind === 'workflow') { state.workflow = value; state.workflowTab = 'introduction'; state.editing = false; state.draft = null; state.returnWorkflow = ''; navigate('workflows',value); return; }
  if (kind === 'workflow-tab') { state.workflowTab = value; render(); return; }
  if (kind === 'workflow-filter') { state.workflowFilter = value; render(); return; }
  if (kind === 'edit-workflow') { state.draft = structuredClone(currentWorkflow()); state.editing = true; render(); return; }
  if (kind === 'cancel-workflow') { const isNew = !state.workflows.some(item => item.id === state.draft?.id); state.editing = false; state.draft = null; if(isNew)navigate('workflows');else render(); return; }
  if (kind === 'save-workflow') { const name = pageElement.querySelector('[name=workflow-name]');if(!name.value.trim()){name.focus();return;}captureWorkflowDraft();const index = state.workflows.findIndex(item => item.id === state.draft.id);if(index < 0)state.workflows.push(state.draft);else state.workflows[index] = state.draft;state.workflow = state.draft.id;state.draft = null;state.editing = false;state.workflowTab = 'configuration';render();return; }
  if (kind === 'use-workflow') { state.reference = currentWorkflow().name; navigate('chat'); return; }
  if (kind === 'new-workflow') { showDialog('选择工作流类型',`<div class="two-columns"><button class="type-choice" data-action="create-workflow:comfyui">${icon('workflow')}<h3>自建 ComfyUI</h3><small>导入工作流 JSON，配置输入输出，选择计算节点。</small></button><button class="type-choice" data-action="create-workflow:online">${icon('model')}<h3>在线模型</h3><small>选择生成服务与模型，配置输入、输出和默认参数。</small></button></div>`,button('取消','close'),true);return; }
  if (kind === 'create-workflow') { if(value === 'online'){showDialog('选择在线模型',`<div class="two-columns"><button class="type-choice" data-action="create-online:ark">${icon('model')}<h3>Seedream</h3><small>火山方舟 · 图片生成</small></button><button class="type-choice" data-action="create-online:minimax">${icon('model')}<h3>MiniMax</h3><small>MiniMax · 视频生成</small></button></div>`,button('返回','new-workflow'),true);return;}state.draft={id:crypto.randomUUID(),type:'comfyui',name:'未命名工作流',description:'',category:'图片',version:'1.0.0',nodes:[]};state.workflow=state.draft.id;state.editing=true;dialog.close();navigate('workflows',state.workflow);return; }
  if (kind === 'create-online') { state.draft={id:crypto.randomUUID(),type:'online',name:value==='ark'?'Seedream 图片生成':'MiniMax 视频生成',description:'',category:value==='ark'?'图片':'视频',version:'1.0.0',connection:value,model:value==='ark'?'Seedream':'MiniMax 视频模型',size:'默认尺寸',nodes:[]};state.workflow=state.draft.id;state.editing=true;dialog.close();navigate('workflows',state.workflow);return; }
  if (kind === 'import-workflow') { showDialog('导入 ComfyUI 工作流','<form id="import-form" class="fields"><label class="field">工作流 JSON<input name="file" type="file" accept=".json,application/json" required></label><label class="field">名称<input name="name" placeholder="输入工作流名称" required></label></form>',button('取消','close')+button('配置输入输出','import-configure','primary')); return; }
  if (kind === 'import-configure') { const form=document.getElementById('import-form');if(!form.reportValidity())return;const data=new FormData(form);state.draft={id:crypto.randomUUID(),type:'comfyui',name:String(data.get('name')),description:'',category:'图片',version:'1.0.0',nodes:[],fileName:data.get('file').name};state.workflow=state.draft.id;state.editing=true;dialog.close();navigate('workflows',state.workflow);return; }
  if (kind === 'new-version') { showDialog('创建版本',`<div class="fields">${field('版本号','version','1.1.0')}<label class="field">版本说明<textarea></textarea></label></div>`,button('取消','close')+button('保存版本','save-version','primary')); return; }
  if (kind === 'save-version') { currentWorkflow().version=dialog.querySelector('[name=version]').value;dialog.close();render();return; }
  if (kind === 'version-content') { const item=currentWorkflow();showDialog('版本内容',`<div class="stack-sm"><h3>${escapeText(item.name)}</h3>${badge(workflowType(item))}${item.type==='online'?onlineFields(item,false):fieldsTable(false)+outputTable(false)}</div>`,button('关闭','close'),true);return; }
  if (kind === 'manage-nodes' || kind === 'manage-services') { captureWorkflowDraft();state.returnWorkflow=state.workflow;state.setting=kind==='manage-nodes'?'nodes':'generation';navigate('settings');return; }
  if (kind === 'return-workflow') { const id=state.returnWorkflow;state.returnWorkflow='';navigate('workflows',id);return; }
  if (kind === 'node') { state.node=value;render();return; }
  if (kind === 'new-node' || kind === 'edit-node') { if(state.page==='workflows')captureWorkflowDraft();nodeDialog(kind === 'new-node');return; }
  if (kind === 'save-node') { const data=new FormData(document.getElementById('node-form'));const name=String(data.get('name')).trim();if(!name){dialog.querySelector('[name=name]').focus();return;}const node={id:data.get('fresh')==='true'?crypto.randomUUID():state.node,name,location:String(data.get('location')),url:String(data.get('url')),category:String(data.get('category'))};if(data.get('fresh')==='true')state.nodes.push(node);else state.nodes[state.nodes.findIndex(item=>item.id===state.node)]=node;state.node=node.id;if(state.page==='workflows'&&state.editing)state.draft.nodes=[node.id];dialog.close();render();return; }
  if (kind === 'deploy-node') { const node=state.nodes.find(item=>item.id===state.node);showDialog('部署 Edge Agent',`<div class="fields">${field('Studio 节点服务地址','service-address','https://studio.example.com')}${field('节点凭据','node-token','','password')}<label class="field">部署命令<pre class="code">CONTROL_PLANE_URL=&lt;Studio 节点服务地址&gt;
EDGE_ID=${escapeText(node.id)}
AGENT_TOKEN=&lt;节点凭据&gt;
COMFYUI_BASE_URL=${escapeText(node.url)}
pixoma-edge-agent</pre></label></div>`,button('关闭','close'),true);return; }
  if (kind === 'skill' || kind === 'new-skill') { const item=state.skills.find(item=>item.id===value)??{name:'',description:'',version:'1.0.0'};showDialog(value?'编辑技能':'新建技能',`<div class="field-row">${field('名称','skill-name',item.name)}${field('版本号','skill-version',item.version)}</div><label class="field">说明<textarea name="skill-description">${escapeText(item.description)}</textarea></label><div class="file-editor"><aside class="file-tree"><strong>技能文件</strong><div>SKILL.md</div><div>references/</div><div>scripts/</div></aside><textarea aria-label="SKILL.md 内容">---
name: storyboard
description: 整理镜头与画面
---

根据创作需求整理分镜。
每个镜头包含景别、画面、动作与对白。</textarea></div>`,button('取消','close')+button('保存技能',`save-skill:${value??''}`,'primary'),true);return; }
  if (kind === 'save-skill') { const existing=state.skills.find(item=>item.id===value);const item={id:value||crypto.randomUUID(),name:dialog.querySelector('[name=skill-name]').value||'未命名技能',description:dialog.querySelector('[name=skill-description]').value,version:dialog.querySelector('[name=skill-version]').value,enabled:true};if(existing)Object.assign(existing,item);else state.skills.push(item);dialog.close();render();return; }
  if (kind === 'expert' || kind === 'new-expert') { state.expertTab='basic';navigate('experts',value||'new');return; }
  if (kind === 'expert-tab') { state.expertTab=value;render();return; }
  if (kind === 'save-expert') { const input=pageElement.querySelector('[name=expert-name]');if(input?.value.trim())state.experts[0].name=input.value.trim();navigate('experts');return; }
  if (kind === 'toggle-skills' || kind === 'toggle-experts') { const item=state[kind==='toggle-skills'?'skills':'experts'].find(item=>item.id===value);item.enabled=!item.enabled;render();return; }
  if (kind === 'setting') { state.setting=value;render();return; }
  if (kind === 'new-service' || kind === 'service') { serviceDialog(value);return; }
  if (kind === 'save-service') { const data=new FormData(document.getElementById('service-form'));const name=String(data.get('name')).trim();if(!name){dialog.querySelector('[name=name]').focus();return;}const existing=state.services.find(service=>service.id===value);const item={id:value||crypto.randomUUID(),name,provider:String(data.get('provider')),configured:Boolean(String(data.get('credential')).trim())||Boolean(existing?.configured)};if(existing)Object.assign(existing,item);else state.services.push(item);dialog.close();render();return; }
  if (kind === 'add-model' || kind === 'model' || kind === 'add-mcp' || kind === 'mcp') { connectionDialog(kind==='add-model'||kind==='model',value===undefined?undefined:Number(value));return; }
  if (kind === 'save-connection') { const data=new FormData(document.getElementById('connection-form'));const item={name:String(data.get('name')).trim(),url:String(data.get('url')),model:String(data.get('model')??'')};if(!item.name){dialog.querySelector('[name=name]').focus();return;}if(extra==='')state[value].push(item);else state[value][Number(extra)]=item;dialog.close();render();return; }
  if (kind === 'pick-workflow' || kind === 'pick-skill') { showDialog(kind==='pick-workflow'?'选择工作流':'选择技能',`<div class="stack-sm">${(kind==='pick-workflow'?state.workflows:state.skills).map(item=>button(escapeText(item.name),`reference:${item.id}:${kind==='pick-workflow'?'workflows':'skills'}`,'ghost',kind==='pick-workflow'?'workflow':'skill')).join('')}</div>`);return; }
  if (kind === 'reference') { state.reference=state[extra].find(item=>item.id===value).name;dialog.close();render();return; }
  if (kind === 'clear-reference') { state.reference='';render();return; }
  if (kind === 'pick-model') { state.setting='models';navigate('settings');return; }
  if (kind === 'permissions') { showDialog('操作权限','<div class="fields"><label class="toggle"><input name="permission" type="radio" checked>需要审批</label><label class="toggle"><input name="permission" type="radio">自动审批</label><label class="toggle"><input name="permission" type="radio">完全访问</label></div>',button('关闭','close'));return; }
  if (kind === 'new-project') { showDialog('新建项目',field('项目名称','project-name'),button('取消','close')+button('创建项目','save-project','primary'));return; }
  if (kind === 'save-project') { const name=dialog.querySelector('[name=project-name]').value.trim();if(name){const entry=document.createElement('button');entry.dataset.nav='chat';entry.innerHTML=icon('folder')+escapeText(name);document.getElementById('projects').append(entry);dialog.close();}return; }
  if (kind === 'new-step' || kind === 'edit-step') { showDialog(kind==='new-step'?'添加步骤':'编辑步骤',`<div class="fields">${field('步骤名称','step-name')}<label class="field">步骤说明<textarea></textarea></label></div>`,button('取消','close')+button('保存步骤','save-step','primary'));return; }
  if (kind === 'save-step') { const title=dialog.querySelector('[name=step-name]').value.trim();if(title){const entry=document.createElement('div');entry.className='sop';entry.innerHTML=`<span class="step-number">4</span><div><h3>${escapeText(title)}</h3><p>步骤说明与确认要求</p></div>`;document.getElementById('sop-list').append(entry);}dialog.close();return; }
  if (kind === 'node-service') { showDialog('节点服务设置',`<div class="fields">${field('监听地址','listen','127.0.0.1')}${field('端口','port','18083','number')}${field('远程访问地址','remote','https://studio.example.com')}<label class="toggle"><input type="checkbox">允许远程节点接入</label></div>`,button('取消','close')+button('保存配置','close','primary'));return; }
  if (kind === 'import-skill' || kind === 'import-asset') { showDialog(kind==='import-skill'?'导入技能':'导入资产',`<label class="field">选择${kind==='import-skill'?'SKILL.md':'文件'}<input type="file" ${kind==='import-skill'?'accept=".md,text/markdown"':'multiple'}></label>`,button('关闭','close'));return; }
  if (kind === 'open-chat') navigate('chat');
});
document.addEventListener('input',event=>{if(event.target.id==='workflow-search'){state.workflowSearch=event.target.value;document.getElementById('workflow-cards').innerHTML=workflowCards();}if(event.target.id==='node-search')document.getElementById('node-list').innerHTML=nodeList(event.target.value);if(event.target.id==='resource-search')document.getElementById('resource-cards').innerHTML=resourceCards(state.page,event.target.value);});
document.addEventListener('change',event=>{if(event.target.id==='workflow-category-filter'){state.workflowCategory=event.target.value;document.getElementById('workflow-cards').innerHTML=workflowCards();}if(event.target.matches('[data-workflow-file]')&&event.target.files[0]){workingWorkflow().fileName=event.target.files[0].name;document.getElementById('workflow-file-name').textContent=event.target.files[0].name;}if(event.target.name==='workflow-connection'){captureWorkflowDraft();render();}});
window.addEventListener('hashchange',render);
render();
</script>
</body>
