<script>
'use strict';
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeText = value => { const element = document.createElement('span'); element.textContent = String(value ?? ''); return element.innerHTML.replaceAll('"','&quot;').replaceAll("'",'&#39;'); };
const button = (label, action, variant = '', symbol = '') => `<button class="btn ${variant}" data-action="${action}">${symbol ? icon(symbol) : ''}${label}</button>`;
const tag = text => `<span class="tag">${escapeText(text)}</span>`;
const header = (title, actions = '', breadcrumb = '') => `<header class="page-header"><div>${breadcrumb ? `<div class="crumb">${breadcrumb}</div>` : ''}<h1>${title}</h1></div><div class="actions">${actions}</div></header>`;
const field = (label, key, value = '', extra = '') => `<label class="field">${label}<input data-field="${key}" value="${escapeText(value)}" ${extra}></label>`;
const search = placeholder => `<label class="search">${icon('search')}<input type="search" data-search aria-label="${placeholder}" placeholder="${placeholder}"></label>`;
const segments = (items, selected, action) => `<div class="segments" role="group" aria-label="${action === 'asset-type' ? '资产类型' : '工作流类型'}">${items.map(([id,label]) => `<button aria-pressed="${id === selected}" data-action="${action}:${id}">${label}</button>`).join('')}</div>`;
const tabs = (items, selected, action, label) => `<div class="tabs" role="tablist" aria-label="${label}">${items.map(([id,text]) => `<button role="tab" aria-selected="${id === selected}" data-action="${action}:${id}">${text}</button>`).join('')}</div>`;
const art = (index = 0) => `<svg class="art" aria-label="素材布局示意" viewBox="0 0 400 300"><rect class="sky" width="400" height="300"/><circle class="sun" cx="${100 + index % 3 * 75}" cy="${75 + index % 2 * 15}" r="26"/><path class="hill" d="M0 210 Q90 ${50 + index % 3 * 35} 200 190 T400 130V300H0Z"/><path class="near" d="M0 260 Q140 130 260 245 T400 215V300H0Z"/></svg>`;
const assets = [

  else if(state.editorTab==='method')body=`<div class="form-column"><div class="section-head"><h3>工作步骤</h3>${button('增加步骤','add-step','outline','plus')}</div>${state.draft.steps.map((step,index)=>`<div class="step"><h3>${index+1}. ${escapeText(step)}</h3><label class="field">步骤说明<textarea data-step="${index}">${escapeText(state.draft.stepDescriptions[index]||'')}</textarea></label></div>`).join('')}</div>`;
  else body=`<div class="rows"><div class="data-row"><span>v${escapeText(state.draft.version)} ${tag('当前版本')}</span><small>保留正文与附带文件</small>${button('查看文件','version-files')}</div><div class="data-row"><span>v1.0.0</span><small>创建${kindName}</small>${button('查看文件','version-files')}</div></div>`;
  page.innerHTML=header(escapeText(title),`${state.dirty?'<span class="status">未保存</span>':'<span class="count">已保存</span>'}`+button('返回列表','capability-back')+button('保存版本','review-open',state.review?'outline':'primary'),'<button data-action="capability-back">技能与专家</button> / '+kindName+' / '+escapeText(state.id==='new'?'创建':title))+`<div class="scroll">${state.review?reviewBlock():''}<div class="toolbar">${tabs(editorTabs,state.editorTab,'editor-tab',`${kindName}编辑`)}</div>${body}</div>`;
}
function renderOther(){page.innerHTML=header(state.page==='settings'?'设置':'新对话')+`<div class="scroll"><div class="empty"><span>${state.page==='settings'?'演示页面保留当前设置入口':'演示页面保留当前对话入口'}</span>${button('打开资产库','open-library','outline')}${button('打开技能与专家','open-capabilities','outline')}</div></div>`;}
function routeAction(action){
  const split=action.indexOf(':');const name=split<0?action:action.slice(0,split);const value=split<0?'':action.slice(split+1);
  switch(name){
    case 'theme':document.documentElement.classList.toggle('dark');return;
    case 'asset-type':state.assetType=value;renderLibrary();return;
    case 'asset-project':state.assetProject=value;renderLibrary();return;
    case 'asset-view':state.assetView=state.assetView==='grid'?'list':'grid';renderLibrary();return;
    case 'asset':state.selectedAsset=value;renderLibrary();return;
    case 'close-inspector':state.selectedAsset='';renderLibrary();return;
    case 'asset-preview':go({mode:'preview',id:value});return;
    case 'asset-back':go({mode:'list',id:''});return;
    case 'upload':toast('演示页面保留系统文件选择入口');return;
    case 'workflow-type':state.workflowType=value;renderWorkflows();return;
    case 'workflow':state.workflowTab='intro';go({mode:'detail',id:value});return;
    case 'workflow-tab':state.workflowTab=value;renderWorkflows();return;
    case 'workflow-back':go({mode:'list',id:''});return;
    case 'workflow-config':state.workflowTab='config';renderWorkflows();return;
    case 'workflow-edit':{const item=workflows.find(item=>item.id===state.id)||workflows[0];state.draft={...item};go({mode:'edit',id:item.id});return;}
    case 'workflow-new':state.draft={name:'新建 ComfyUI 工作流',description:''};go({mode:'edit',id:'new'});return;
    case 'workflow-save':{let item=workflows.find(item=>item.id===state.id);if(item)Object.assign(item,state.draft);else {item={id:`workflow-${Date.now()}`,type:'comfyui',category:'图片',version:'1.0.0',...state.draft};workflows.push(item);}state.dirty=false;go({mode:'detail',id:item.id});toast('演示草稿已保存');return;}
    case 'workflow-cancel':go({mode:state.id==='new'?'list':'detail'});return;
    case 'workflow-run':go({mode:'run'});return;
    case 'workflow-version':toast('版本号与文件变化在当前页面展开，交互可在技能编辑中体验');return;
    case 'run-demo':{const result=document.getElementById('run-result');result.hidden=false;result.innerHTML='<h3>运行区域</h3><p class="muted">布局演示未连接计算节点，实际执行结果将在此处显示。</p>';return;}
    case 'kind':go({mode:'list',id:'',kind:value});return;
    case 'capability':startCapability(value);return;
    case 'capability-new':startCapability('');return;
    case 'import-skill':state.kind='skills';startCapability('');state.draft.name='导入的技能';renderCapabilityEditor();toast('ZIP 导入后在此页面检查文件并保存版本');return;
    case 'capability-back':go({mode:'list',id:''});return;
    case 'editor-tab':state.editorTab=value;renderCapabilityEditor();return;
    case 'file':state.file=value;renderCapabilityEditor();return;
    case 'document-mode':state.preview=value==='preview';renderCapabilityEditor();return;
    case 'review-open':state.review=true;renderCapabilityEditor();return;
    case 'review-close':state.review=false;renderCapabilityEditor();return;
    case 'save-capability':{if(!state.draft.name.trim()){toast('填写名称后保存');state.editorTab='basic';renderCapabilityEditor();return;}const item=collection().find(item=>item.id===state.id);const saved={...state.draft,files:{...state.files},steps:[...state.draft.steps],stepDescriptions:{...state.draft.stepDescriptions}};if(item)Object.assign(item,saved);else{state.id=`demo-${Date.now()}`;collection().push({id:state.id,...saved});}state.dirty=false;state.review=false;renderCapabilityEditor();toast('演示版本已保存');return;}
    case 'version-files':state.editorTab=state.kind==='skills'?'files':'role';renderCapabilityEditor();return;
    case 'new-file':document.getElementById('file-add').hidden=false;document.getElementById('file-name').focus();return;
    case 'add-file':{const name=document.getElementById('file-name').value.trim();if(!name||state.files[name]!==undefined){toast('输入尚未使用的文件路径');return;}state.files[name]='';state.file=name;state.dirty=true;renderCapabilityEditor();return;}
    case 'add-step':state.draft.steps.push('新增步骤');state.dirty=true;renderCapabilityEditor();return;
    case 'reference-capability':toast('引用能力可在当前页面选择并固定版本');return;
    case 'open-library':go({page:'library',mode:'list',id:''});return;
    case 'open-capabilities':go({page:'capabilities',mode:'list',id:''});return;
    case 'stay':state.pendingNavigation=null;leaveDialog.close();return;
    case 'discard':{const patch=state.pendingNavigation;state.dirty=false;leaveDialog.close();state.pendingNavigation=null;if(patch)go(patch);return;}
  }
}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav){go({page:nav.dataset.nav,mode:'list',id:''});return;}const action=event.target.closest('[data-action]');if(action)routeAction(action.dataset.action);});
document.addEventListener('input',event=>{
  if(event.target.matches('[data-search]')){const query=event.target.value.toLocaleLowerCase();document.querySelectorAll('[data-search-item]').forEach(item=>item.hidden=!item.dataset.searchItem.toLocaleLowerCase().includes(query));return;}
  if(event.target.matches('[data-file-content]')){state.files[state.file]=event.target.value;state.dirty=true;}
  if(event.target.dataset.field){if(event.target.dataset.field==='assetName'){const asset=assets.find(item=>item.id===state.selectedAsset);if(asset)asset.name=event.target.value;return;}state.draft[event.target.dataset.field]=event.target.value;state.dirty=true;}
  if(event.target.dataset.field==='type'){renderWorkflows();return;}
  if(event.target.dataset.step!==undefined){state.draft.stepDescriptions[event.target.dataset.step]=event.target.value;state.dirty=true;}
  if(state.dirty){const status=document.querySelector('.page-header .count');if(status){status.className='status';status.textContent='未保存';}}
});
window.addEventListener('hashchange',()=>{const query=new URLSearchParams(location.hash.slice(1));if(state.dirty){state.pendingNavigation={page:query.get('page')||'library',kind:query.get('kind')||'skills',mode:query.get('mode')||'list',id:query.get('id')||''};const current=new URLSearchParams({page:state.page,kind:state.kind,mode:state.mode,id:state.id});history.replaceState(null,'','#'+current.toString());leaveDialog.showModal();return;}readHash();render();});
readHash();render();
</script>
</body>
</html>
